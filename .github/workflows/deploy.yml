name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << 'EOF'
            if [ -d ~/cloud-cicd-project/.git ]; then
              cd ~/cloud-cicd-project
              git pull origin main
            else
              git clone https://github.com/piyushsharmaec23/cloud-cicd-project.git ~/cloud-cicd-project
            fi

            sudo cp ~/cloud-cicd-project/index.html /var/www/html/index.html
            sudo systemctl restart nginx
          EOF