name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website file
        run: |
          test -f index.html
          echo "index.html found successfully"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |

          # Create SSH directory
          mkdir -p ~/.ssh

          # Decode Base64 private key
          echo "$EC2_SSH_KEY" | base64 --decode > ~/.ssh/ec2_key

          # Set secure permissions
          chmod 600 ~/.ssh/ec2_key

          # Add EC2 host to known hosts
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Connect to EC2 and deploy
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << 'EOF'

            # If project already exists, update it
            if [ -d ~/cloud-cicd-project/.git ]; then
              cd ~/cloud-cicd-project
              git pull origin main
            else
              git clone https://github.com/piyushsharmaec23/cloud-cicd-project.git ~/cloud-cicd-project
            fi

            # Copy latest website to Nginx
            sudo cp ~/cloud-cicd-project/index.html /var/www/html/index.html

            # Restart Nginx
            sudo systemctl restart nginx

            echo "Deployment completed successfully!"

          EOF